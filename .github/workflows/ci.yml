name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支连续推送时取消旧运行:否则每次 push 都会堆一份完整流水线(含最慢的 WASM 链接)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限:CI 只读仓库(部署由 deploy-pages.yml 单独声明 pages 权限)
permissions:
  contents: read

jobs:
  # WASM 产物**只构建一次**,由 web / e2e 两个 job 下载复用。
  #
  # release profile 是 opt-level="z" + lto + codegen-units=1(最慢的一档),
  # 早先三个 job 各编一次同一份产物,且 rust-cache 的 key 含 job 名、互不命中。
  wasm:
    name: WASM 构建(产物供 web / e2e 复用)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust(wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 安装 wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: 构建 WASM
        run: wasm-pack build crates/wasm --target web --out-dir ../../web/src/wasm/pkg --out-name office_wasm

      - name: 上传 WASM 产物
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Rust 内核(fmt / clippy / test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 单元测试
        run: cargo test --all --locked

  web:
    name: Web 视图层(typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: wasm
    steps:
      - uses: actions/checkout@v7

      - name: 下载 WASM 产物
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm -C web typecheck

      - name: 单元测试
        run: pnpm -C web test

      - name: 构建
        run: pnpm -C web build

  e2e:
    name: 浏览器端到端(Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: wasm
    steps:
      - uses: actions/checkout@v7

      - name: 下载 WASM 产物
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg

      # 夹具由 Rust 内核构造,故此 job 仍需原生工具链。
      # TODO: 改为「入库夹具 + rust job 里做漂移校验」后即可去掉(见 docs/architecture.md)
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 e2e 夹具(从 Rust 内核构造 docx/xlsx/pptx)
        run: pnpm -C web e2e:fixtures

      - name: 安装 Playwright 浏览器(chromium)
        run: pnpm -C web exec playwright install --with-deps chromium

      - name: 端到端测试
        run: pnpm -C web e2e

      # playwright.config.ts 已开 trace: on-first-retry,但产物一直被丢弃 ——
      # 失败时不上传的话,CI 上的 flaky 完全无法排查。
      - name: 上传 Playwright 报告(仅失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
