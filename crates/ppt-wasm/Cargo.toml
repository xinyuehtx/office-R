[package]
name = "office-ppt-wasm"
description = "PowerPoint (.pptx) 的 wasm-bindgen 绑定(独立 cdylib)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
office-ppt = { workspace = true }
office-wasm-log = { workspace = true }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
